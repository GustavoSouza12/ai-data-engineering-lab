version: 2

sources:
  - name: orders_staging
    description: >
      Validated orders CSVs written by ingestion/validate_orders.py (F0.1) under
      data/staging/orders/. Every column is read as text; staging trims and casts.
      MVP-06 switches this source to the RAW layer.
    meta:
      owner: data-engineering
      external_location: >-
        read_csv('{{ var("orders_staging_dir") }}/*.csv',
                 header = true, all_varchar = true, union_by_name = true)
    tables:
      - name: orders
        description: One row per order version that passed structural validation (ADR-0009).
        columns:
          - name: order_id
            meta: {pii_level: internal}
          - name: organization_id
            meta: {pii_level: internal}
          - name: investor_id
            meta: {pii_level: internal}
          - name: fund_id
            meta: {pii_level: internal}
          - name: amount
            meta: {pii_level: confidential}
          - name: currency
            meta: {pii_level: internal}
          - name: channel
            meta: {pii_level: internal}
          - name: status
            meta: {pii_level: internal}
          - name: submitted_at
            meta: {pii_level: internal}
          - name: updated_at
            meta: {pii_level: internal}
          - name: _source_file
            meta: {pii_level: internal}
          - name: _loaded_at
            meta: {pii_level: internal}
