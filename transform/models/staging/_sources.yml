version: 2

sources:
  - name: raw
    description: >
      Local DuckDB RAW layer (MVP-06) written by ingestion/load_raw.py from the
      validator outputs, in the same DuckDB file as the dev target. Every column
      is text, exactly as received; staging trims and casts. Mirrors what
      COPY INTO will load into Snowflake RAW (MVP-15a).
    schema: raw
    meta:
      owner: data-engineering
    tables:
      - name: orders
        description: >
          One row per order version that passed structural validation (ADR-0009).
          Replaced per _source_file on every load.
        columns:
          - name: order_id
            meta: {pii_level: internal}
          - name: organization_id
            meta: {pii_level: internal}
          - name: investor_id
            meta: {pii_level: internal}
          - name: fund_id
            meta: {pii_level: internal}
          - name: amount
            meta: {pii_level: confidential}
          - name: currency
            meta: {pii_level: internal}
          - name: channel
            meta: {pii_level: internal}
          - name: status
            meta: {pii_level: internal}
          - name: submitted_at
            meta: {pii_level: internal}
          - name: updated_at
            meta: {pii_level: internal}
          - name: _source_file
            meta: {pii_level: internal}
          - name: _loaded_at
            meta: {pii_level: internal}
      - name: orders_quarantine
        description: >
          Rows the validator quarantined, with reject_reason (ADR-0011). Same columns
          and pii_level as raw.orders. Replaced per _source_file in the same
          transaction as raw.orders. No model reads it. Locally only the pii_level
          tags apply; the restricted access of ADR-0011 arrives with Snowflake (MVP-15a).
        columns:
          - name: order_id
            meta: {pii_level: internal}
          - name: organization_id
            meta: {pii_level: internal}
          - name: investor_id
            meta: {pii_level: internal}
          - name: fund_id
            meta: {pii_level: internal}
          - name: amount
            meta: {pii_level: confidential}
          - name: currency
            meta: {pii_level: internal}
          - name: channel
            meta: {pii_level: internal}
          - name: status
            meta: {pii_level: internal}
          - name: submitted_at
            meta: {pii_level: internal}
          - name: updated_at
            meta: {pii_level: internal}
          - name: _source_file
            meta: {pii_level: internal}
          - name: _loaded_at
            meta: {pii_level: internal}
          - name: reject_reason
            meta: {pii_level: internal}
