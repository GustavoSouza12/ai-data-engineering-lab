name: lab_transform
version: "0.1.0"
config-version: 2
profile: lab_transform

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

flags:
  # No usage telemetry leaves the machine.
  send_anonymous_usage_stats: false

vars:
  # Folder with the validated CSVs written by ingestion/validate_orders.py.
  # Relative paths resolve against the directory dbt runs from (transform/).
  # MVP-06 switches this source to Snowflake/DuckDB RAW.
  orders_staging_dir: "../data/staging/orders"
  # T3 (ADR-0017): semantic tests warn on any failure and only error above this
  # many failing rows, so the three planted errors stay visible in gold.
  semantic_error_threshold: 10
  # Severity of assert_no_cross_file_conflicting_versions (ADR-0009: no silent
  # resolution). How gold treats a cross-file conflict is pending the owner's
  # decision; this var is the single place to change the severity.
  cross_file_conflict_severity: error

models:
  lab_transform:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    gold:
      +materialized: table
    marts:
      +materialized: view

seeds:
  lab_transform:
    +quote_columns: false

data_tests:
  lab_transform:
    +store_failures: true
