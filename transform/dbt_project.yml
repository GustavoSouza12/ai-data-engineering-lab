name: lab_transform
version: "0.1.0"
config-version: 2
profile: lab_transform

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

flags:
  # No usage telemetry leaves the machine.
  send_anonymous_usage_stats: false

vars:
  # Folder with the validated CSVs written by ingestion/validate_orders.py.
  # Relative paths resolve against the directory dbt runs from (transform/).
  # MVP-06 switches this source to Snowflake/DuckDB RAW.
  orders_staging_dir: "../data/staging/orders"
  # T3 (ADR-0017): semantic tests warn on any failure and only error above this
  # many failing rows, so the three planted errors stay visible in gold.
  semantic_error_threshold: 10
  # assert_no_cross_file_conflicting_versions (TS-026, ADR-0009 amendment of
  # 2026-11-23): a conflicted order leaves gold for dq_orders_cross_file_conflicts,
  # so the test warns from the first conflicted order of the newest batch and
  # errors only above the threshold, the T3 pattern. The severity must stay error
  # for error_if to apply (dbt ignores error_if at severity warn).
  cross_file_conflict_severity: error
  # Per batch, not cumulative: only conflicted orders with an occurrence in the
  # newest daily file count. More than this many in one batch means the source's
  # versioning is broken, not one bad order. One conflicted order never trips it,
  # and a long --plant-cross-file-conflict chain (one per daily file) stays at warn.
  cross_file_conflict_error_threshold: 10

models:
  lab_transform:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    dq:
      +materialized: table
    gold:
      +materialized: table
    marts:
      +materialized: view

seeds:
  lab_transform:
    +quote_columns: false

data_tests:
  lab_transform:
    +store_failures: true
