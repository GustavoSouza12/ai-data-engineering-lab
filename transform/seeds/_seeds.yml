version: 2

seeds:
  - name: organizations
    description: >
      Synthetic customer organizations (sponsors and advisor firms), ORG-001 to ORG-020.
      ORG-016 to ORG-020 have no orders on purpose, so org_summary must keep them (TS-021).
    config:
      column_types:
        organization_id: varchar
        organization_name: varchar
        organization_type: varchar
      meta:
        owner: data-engineering
    columns:
      - name: organization_id
        description: Synthetic organization key (ORG-001).
        meta: {pii_level: internal}
        data_tests:
          - unique
          - not_null
      - name: organization_name
        description: Synthetic organization name.
        meta: {pii_level: internal}
        data_tests:
          - not_null
      - name: organization_type
        description: sponsor or advisor_firm.
        meta: {pii_level: internal}
        data_tests:
          - accepted_values:
              arguments:
                values: ["sponsor", "advisor_firm"]

  - name: fx_rates
    description: >
      Synthetic daily exchange rates to USD (ADR-0013), one row per (rate_date, currency).
      Covers 2026-11-01 to 2026-12-31 for USD, EUR and BRL: the sample's submitted_at dates
      (hand-written, 2026-11-01 to 2026-11-12) and every daily file date the generator writes
      up to 2026-12-31 (generated by ingestion/generate_fx_rates.py, deterministic).
    config:
      column_types:
        rate_date: date
        currency: varchar
        rate_to_usd: decimal(18, 6)
      meta:
        owner: data-engineering
    data_tests:
      - unique_combination:
          arguments:
            combination: ["rate_date", "currency"]
    columns:
      - name: rate_date
        description: Date the rate applies to.
        meta: {pii_level: internal}
        data_tests:
          - not_null
      - name: currency
        description: ISO currency code (USD, EUR, BRL).
        meta: {pii_level: internal}
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["USD", "EUR", "BRL"]
      - name: rate_to_usd
        description: Multiply an amount in this currency by this rate to get USD.
        meta: {pii_level: internal}
        data_tests:
          - not_null
          - expression_is_true:
              arguments:
                expression: "rate_to_usd > 0"
