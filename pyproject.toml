[project]
name = "ai-data-engineering-lab"
version = "0.1.0"
description = "AI Data Engineering lab with synthetic data (phase 0: orders ingestion)."
requires-python = ">=3.11,<3.12"
dependencies = [
    "dbt-core>=1.12,<1.13",
    "dbt-duckdb>=1.11.1,<1.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.6",
    "sqlfluff>=4.5.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Explicit set so a newer ruff default cannot turn CI red on its own.
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["ingestion/tests", "transform/integration_tests"]
pythonpath = ["."]
